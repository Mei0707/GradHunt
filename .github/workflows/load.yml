name: Local container load and SLO report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t gradhunt:load .
      - name: Exercise runtime, auth, readiness and recovery
        run: bash scripts/container_smoke.sh gradhunt:load
        env:
          RUN_LOAD: 'true'
          GRADHUNT_TEST_PREFIX: gradhunt-load
      - name: Generate SLO evidence
        if: always()
        run: python3 scripts/slo_report.py reports/k6-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-load-slo
          path: reports/
