# Local production-shaped stack for the agent service.
#
#   docker compose up -d postgres redis   # just the data layer (run uvicorn on host)
#   docker compose up --build             # full stack incl. the agent service
#
# Postgres is published on host port 5433 to avoid clashing with a local 5432.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gradhunt
      POSTGRES_PASSWORD: gradhunt
      POSTGRES_DB: gradhunt_agents
    ports:
      - "5433:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradhunt -d gradhunt_agents"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  agent-service:
    build: .
    ports:
      - "8100:8100"
    environment:
      # Inside the compose network, reach Postgres/Redis by service name.
      DATABASE_URL: postgresql+psycopg://gradhunt:gradhunt@postgres:5432/gradhunt_agents
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  agent_pgdata:
